name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        # requirements.lock is a Windows pip freeze: drop Windows-only pins and the self editable.
        run: |
          grep -vE '^(-e |pywin32|win32_setctime)' requirements.lock > /tmp/requirements.txt
          pip install -r /tmp/requirements.txt
          pip install -e ".[dev]" --no-deps
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -m smoke
