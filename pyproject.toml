[build-system]
requires=["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragas-eval-framework"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "ragas",
    "langchain",
    "langchain-community",
    "langchain-text-splitters",
    "langchain-openai",
    "langchain-qdrant",
    "qdrant-client",
    "pydantic-settings",
    "python-dotenv",
    "pyyaml",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest","pytest-asyncio","ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: fast subset, run on every PR",
    "Regression: full dataset, nightly",
]